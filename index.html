<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock & Stopwatch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #1b263b, #0d1b2a 75%);
      color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .top-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #00f5d4;
      background: rgba(0, 245, 212, 0.12);
      border: 1px solid rgba(0, 245, 212, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      color: #ffffff;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(9, 13, 22, 0.8);
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      padding: 10px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #adb5bd;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: #00f5d4;
      color: #051923;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .screen-box {
      background: #090d16;
      border: 1px solid rgba(0, 245, 212, 0.25);
      border-radius: 16px;
      padding: 20px 12px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: inset 0 0 20px rgba(0, 245, 212, 0.08);
    }

    .big-time {
      font-size: 38px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      color: #00f5d4;
      text-shadow: 0 0 14px rgba(0, 245, 212, 0.45);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .action-btn {
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #startBtn {
      background: linear-gradient(135deg, #00c853, #00e676);
      color: #06210f;
    }

    #stopBtn {
      background: linear-gradient(135deg, #ff1744, #ff5252);
      color: #ffffff;
    }

    #lapBtn {
      background: linear-gradient(135deg, #00b0ff, #00e5ff);
      color: #041e2b;
    }

    #resetBtn {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .primary-btn {
      background: linear-gradient(135deg, #00b0ff, #00f5d4);
      color: #041e2b;
    }

    .preview-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: #adb5bd;
    }

    .small-danger-btn {
      background: transparent;
      color: #ff6b6b;
      border: none;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
    }

    .small-danger-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .scroll-list {
      list-style: none;
      max-height: 170px;
      overflow-y: auto;
      border-radius: 12px;
      background: rgba(9, 13, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .lap-item, .alarm-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }

    .lap-item {
      font-family: 'Courier New', monospace;
    }

    .lap-item:last-child, .alarm-item:last-child {
      border-bottom: none;
    }

    .world-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .world-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 13, 22, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .city-name {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }

    .city-sub {
      font-size: 12px;
      color: #90e0ef;
    }

    .city-time {
      text-align: right;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 16px;
      color: #00f5d4;
    }

    .city-date {
      font-size: 11px;
      color: #adb5bd;
    }

    .alarm-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .alarm-row {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 10px;
    }

    .alarm-btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .alarm-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #090d16;
      color: #ffffff;
      font-size: 14px;
    }

    .del-btn {
      background: rgba(255, 71, 87, 0.2);
      color: #ff6b81;
      border: 1px solid rgba(255, 71, 87, 0.4);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-msg {
      text-align: center;
      color: #6c757d;
      font-size: 13px;
      padding: 16px;
    }

    .alarm-banner {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 23, 68, 0.2);
      border: 1px solid #ff5252;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .alarm-banner.show {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="top-header">
      <span class="badge">ICT PROJECT</span>
      <h1>Digital Clock &amp; Stopwatch</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="stopwatch">Stopwatch</button>
      <button class="tab-btn" data-tab="world">World Clock</button>
      <button class="tab-btn" data-tab="alarm">Alarm</button>
    </div>

    <!-- TAB 1: STOPWATCH -->
    <div id="stopwatch" class="tab-panel active">
      <div class="screen-box">
        <div id="swDisplay" class="big-time">00:00:00.00</div>
      </div>

      <div class="controls">
        <button id="startBtn" class="action-btn">Start</button>
        <button id="stopBtn" class="action-btn" disabled>Stop</button>
        <button id="lapBtn" class="action-btn" disabled>Lap</button>
        <button id="resetBtn" class="action-btn">Reset</button>
      </div>

      <div class="list-header">
        <span>Recorded Laps</span>
        <button id="clearLapsBtn" class="small-danger-btn" disabled>Clear Laps</button>
      </div>
      <ul id="lapsList" class="scroll-list">
        <li class="empty-msg">No laps recorded yet.</li>
      </ul>
    </div>

    <!-- TAB 2: WORLD CLOCK -->
    <div id="world" class="tab-panel">
      <div class="screen-box">
        <div class="city-sub">Local Time (Pakistan)</div>
        <div id="localClockDisplay" class="big-time">--:--:--</div>
        <div id="localDateDisplay" class="city-date" style="margin-top: 4px;"></div>
      </div>
      <div id="worldClockList" class="world-grid"></div>
    </div>

    <!-- TAB 3: ALARM -->
    <div id="alarm" class="tab-panel">
      <div class="screen-box">
        <div class="city-sub">Current Time</div>
        <div id="alarmLiveClock" class="big-time">--:--:--</div>
      </div>

      <div class="alarm-box">
        <div class="alarm-row">
          <input type="time" id="alarmTimeInput" class="alarm-input" step="60">
          <select id="alarmToneSelect" class="alarm-input">
            <option value="beep">Classic Beep</option>
            <option value="pulse">Digital Pulse</option>
            <option value="chime">Gentle Chime</option>
            <option value="siren">Alert Siren</option>
          </select>
        </div>
        <div class="alarm-btn-row">
          <button id="previewToneBtn" type="button" class="action-btn preview-btn">Preview Tune</button>
          <button id="addAlarmBtn" type="button" class="action-btn primary-btn">Add Alarm</button>
        </div>
      </div>

      <div class="list-header">
        <span>Scheduled Alarms</span>
      </div>
      <ul id="alarmsList" class="scroll-list">
        <li class="empty-msg">No alarms scheduled.</li>
      </ul>

      <div id="alarmBanner" class="alarm-banner">
        <span id="alarmBannerText" style="font-weight: 700;">Alarm Ringing!</span>
        <button id="dismissAlarmBtn" type="button" class="action-btn" style="background:#ff5252;color:#fff;padding:7px 12px;">Stop Alarm</button>
      </div>
    </div>
  </div>

  <script>
    // --- TAB SWITCHING ---
    const tabBtns = document.querySelectorAll(".tab-btn");
    const tabPanels = document.querySelectorAll(".tab-panel");

    tabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        tabPanels.forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });

    // --- STOPWATCH LOGIC ---
    let swStart = 0;
    let swElapsed = 0;
    let swInterval = null;
    let lapCount = 0;

    const swDisplay = document.getElementById("swDisplay");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const lapBtn = document.getElementById("lapBtn");
    const resetBtn = document.getElementById("resetBtn");
    const clearLapsBtn = document.getElementById("clearLapsBtn");
    const lapsList = document.getElementById("lapsList");

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function formatSw(ms) {
      const csTotal = Math.floor(ms / 10);
      const cs = csTotal % 100;
      const secTotal = Math.floor(csTotal / 100);
      const sec = secTotal % 60;
      const minTotal = Math.floor(secTotal / 60);
      const min = minTotal % 60;
      const hr = Math.floor(minTotal / 60);
      return `${pad2(hr)}:${pad2(min)}:${pad2(sec)}.${pad2(cs)}`;
    }

    function setSwButtons(running) {
      startBtn.disabled = running;
      stopBtn.disabled = !running;
      lapBtn.disabled = !running;
      clearLapsBtn.disabled = lapsList.querySelectorAll(".lap-item").length === 0;
    }

    startBtn.addEventListener("click", () => {
      if (swInterval !== null) return;
      swStart = performance.now() - swElapsed;
      swInterval = setInterval(() => {
        swElapsed = performance.now() - swStart;
        swDisplay.textContent = formatSw(swElapsed);
      }, 10);
      setSwButtons(true);
    });

    stopBtn.addEventListener("click", () => {
      if (swInterval === null) return;
      clearInterval(swInterval);
      swInterval = null;
      setSwButtons(false);
    });

    lapBtn.addEventListener("click", () => {
      if (swElapsed === 0 && swInterval === null) return;
      if (lapsList.querySelector(".empty-msg")) {
        lapsList.innerHTML = "";
      }
      lapCount++;
      const li = document.createElement("li");
      li.className = "lap-item";
      li.innerHTML = `<span style="color:#90e0ef;font-weight:700;">Lap #${pad2(lapCount)}</span><span>${formatSw(swElapsed)}</span>`;
      lapsList.prepend(li);
      setSwButtons(swInterval !== null);
    });

    resetBtn.addEventListener("click", () => {
      clearInterval(swInterval);
      swInterval = null;
      swStart = 0;
      swElapsed = 0;
      lapCount = 0;
      swDisplay.textContent = "00:00:00.00";
      lapsList.innerHTML = `<li class="empty-msg">No laps recorded yet.</li>`;
      setSwButtons(false);
    });

    clearLapsBtn.addEventListener("click", () => {
      lapCount = 0;
      lapsList.innerHTML = `<li class="empty-msg">No laps recorded yet.</li>`;
      setSwButtons(swInterval !== null);
    });

    // --- WORLD CLOCK & LIVE CLOCK ---
    const worldCities = [
      { city: "Multan / Karachi", zone: "Asia/Karachi", tag: "PKT (UTC+5)" },
      { city: "Dubai", zone: "Asia/Dubai", tag: "GST (UTC+4)" },
      { city: "London", zone: "Europe/London", tag: "UK Time" },
      { city: "New York", zone: "America/New_York", tag: "US Eastern" },
      { city: "Tokyo", zone: "Asia/Tokyo", tag: "JST (UTC+9)" }
    ];

    const localClockDisplay = document.getElementById("localClockDisplay");
    const localDateDisplay = document.getElementById("localDateDisplay");
    const alarmLiveClock = document.getElementById("alarmLiveClock");
    const worldClockList = document.getElementById("worldClockList");

    function updateClocks() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString("en-US", { hour12: true });
      const dateStr = now.toLocaleDateString("en-US", {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric"
      });

      localClockDisplay.textContent = timeStr;
      localDateDisplay.textContent = dateStr;
      alarmLiveClock.textContent = timeStr;

      worldClockList.innerHTML = worldCities.map(item => {
        const cTime = now.toLocaleTimeString("en-US", {
          timeZone: item.zone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true
        });
        const cDate = now.toLocaleDateString("en-US", {
          timeZone: item.zone,
          weekday: "short",
          month: "short",
          day: "numeric"
        });
        return `
          <div class="world-card">
            <div>
              <div class="city-name">${item.city}</div>
              <div class="city-sub">${item.tag}</div>
            </div>
            <div>
              <div class="city-time">${cTime}</div>
              <div class="city-date">${cDate}</div>
            </div>
          </div>
        `;
      }).join("");

      checkAlarms(now);
    }

    // --- OFFLINE ALARM TONES (WEB AUDIO API) ---
    const toneNames = {
      beep: "Classic Beep",
      pulse: "Digital Pulse",
      chime: "Gentle Chime",
      siren: "Alert Siren"
    };

    let alarms = [];
    let triggeredMinuteKey = "";
    let ringInterval = null;
    let audioCtx = null;

    const alarmTimeInput = document.getElementById("alarmTimeInput");
    const alarmToneSelect = document.getElementById("alarmToneSelect");
    const previewToneBtn = document.getElementById("previewToneBtn");
    const addAlarmBtn = document.getElementById("addAlarmBtn");
    const alarmsList = document.getElementById("alarmsList");
    const alarmBanner = document.getElementById("alarmBanner");
    const alarmBannerText = document.getElementById("alarmBannerText");
    const dismissAlarmBtn = document.getElementById("dismissAlarmBtn");

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(toneType) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        if (toneType === "pulse") {
          [660, 880].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "square";
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);
            gain.gain.setValueAtTime(0.1, now + idx * 0.14);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 0.11);
          });
        } else if (toneType === "chime") {
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + idx * 0.18);
            gain.gain.setValueAtTime(0.18, now + idx * 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.18);
            osc.stop(now + idx * 0.18 + 0.25);
          });
        } else if (toneType === "siren") {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.linearRampToValueAtTime(980, now + 0.25);
          osc.frequency.linearRampToValueAtTime(520, now + 0.5);
          gain.gain.setValueAtTime(0.14, now);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.52);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.2, now);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        }
      } catch (e) {}
    }

    previewToneBtn.addEventListener("click", () => {
      playTone(alarmToneSelect.value);
    });

    function startAlarmRing(alarm) {
      alarmBannerText.textContent = `Alarm Ringing (${alarm.time}) - ${toneNames[alarm.tone] || "Classic Beep"}`;
      alarmBanner.classList.add("show");
      playTone(alarm.tone);
      if (!ringInterval) {
        ringInterval = setInterval(() => playTone(alarm.tone), 1100);
      }
    }

    function stopAlarmRing() {
      alarmBanner.classList.remove("show");
      if (ringInterval) {
        clearInterval(ringInterval);
        ringInterval = null;
      }
    }

    dismissAlarmBtn.addEventListener("click", stopAlarmRing);

    function renderAlarms() {
      if (alarms.length === 0) {
        alarmsList.innerHTML = `<li class="empty-msg">No alarms scheduled.</li>`;
        return;
      }
      alarmsList.innerHTML = alarms.map(a => `
        <li class="alarm-item">
          <div>
            <strong style="font-family:'Courier New',monospace;font-size:16px;color:#00f5d4;">${a.time}</strong>
            <span style="margin-left:8px;color:#ced4da;">${toneNames[a.tone] || "Classic Beep"}</span>
          </div>
          <button class="del-btn" onclick="deleteAlarm(${a.id})">Delete</button>
        </li>
      `).join("");
    }

    window.deleteAlarm = function(id) {
      alarms = alarms.filter(a => a.id !== id);
      renderAlarms();
    };

    addAlarmBtn.addEventListener("click", () => {
      const val = alarmTimeInput.value;
      if (!val) return;
      alarms.push({
        id: Date.now(),
        time: val,
        tone: alarmToneSelect.value
      });
      renderAlarms();
    });

    function checkAlarms(now) {
      const hh = pad2(now.getHours());
      const mm = pad2(now.getMinutes());
      const currentHHMM = `${hh}:${mm}`;
      const minuteKey = `${now.toDateString()}-${currentHHMM}`;

      if (minuteKey === triggeredMinuteKey) return;

      const matched = alarms.find(a => a.time === currentHHMM);
      if (matched) {
        triggeredMinuteKey = minuteKey;
        startAlarmRing(matched);
      }
    }

    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
